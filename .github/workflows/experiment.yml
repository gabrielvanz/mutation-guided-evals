name: experiment
# Executa a malha de continuous evals: matriz módulo × condição × repetição.
# Requer o secret GEMINI_API_KEY (ou ajuste LLM_PROVIDER/LLM_BASE_URL/LLM_API_KEY para outro provedor).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "ID EXATO do modelo (sem alias -latest). Registrado em cada result.json."
        required: true
      conditions:
        description: "Condições (separadas por vírgula)"
        default: "C0,C1,C2,C2r,C3"
      reps:
        description: "Repetições por condição com LLM"
        default: "3"
      library:
        description: "Opcional: rodar só uma biblioteca (ufo, defu, pathe, knitwork)"
        default: ""
      min_interval_ms:
        description: "Intervalo mínimo entre chamadas por job (ms). Com max-parallel=2, use o dobro do necessário por job."
        default: "9000"

# Um dispatch por vez: cada lote commita seus resultados em runs/ e o próximo lote os enxerga.
concurrency:
  group: experiment
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      pending: ${{ steps.m.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - id: m
        env:
          # runs de OUTRO modelo não contam como concluídos (não misturar modelos)
          LLM_MODEL: ${{ inputs.model }}
        run: |
          ARGS="--conditions ${{ inputs.conditions }} --reps ${{ inputs.reps }} --skip-done"
          if [ -n "${{ inputs.library }}" ]; then ARGS="$ARGS --library ${{ inputs.library }}"; fi
          M="$(npm run -s matrix -- $ARGS)"
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "pending=$(echo "$M" | jq '.include | length')" >> "$GITHUB_OUTPUT"

  run:
    needs: matrix
    if: needs.matrix.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      LLM_PROVIDER: gemini
      LLM_MODEL: ${{ inputs.model }}
      LLM_MIN_INTERVAL_MS: ${{ inputs.min_interval_ms }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Preparar sujeito no commit fixado
        run: scripts/setup-subject.sh ${{ matrix.library }} "$RUNNER_TEMP/${{ matrix.library }}"
      - name: Executar run
        run: >
          npm run -s run --
          --library ${{ matrix.library }} --module ${{ matrix.module }}
          --condition ${{ matrix.condition }} --rep ${{ matrix.rep }}
          --workdir "$RUNNER_TEMP/${{ matrix.library }}"
          --memo-file data/memorization.flat.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # nome = run_id: o job persist baixa cada artifact em runs/<run_id>/
          name: ${{ matrix.library }}__${{ matrix.module }}__${{ matrix.condition }}__r${{ matrix.rep }}
          path: runs/${{ matrix.library }}__${{ matrix.module }}__${{ matrix.condition }}__r${{ matrix.rep }}
          retention-days: 90

  # Guarda os resultados no repositório ao fim de cada lote. Sem isso, o próximo dispatch começa do zero.
  persist:
    needs: [matrix, run]
    if: always() && needs.matrix.result == 'success' && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: "*__r[0-9]*"
          path: runs
      - name: Descartar runs com erro de infraestrutura (refeitos no próximo lote)
        run: |
          # provider_error (ex.: 429 de cota), stryker_error e timeout não têm dado válido e violam o schema.
          # Também limpa os que já estavam commitados de lotes anteriores.
          for f in runs/*/result.json; do
            [ -f "$f" ] || continue
            s="$(jq -r .status "$f")"
            case "$s" in
              provider_error|stryker_error|timeout) echo "descartando $(dirname "$f") ($s)"; rm -rf "$(dirname "$f")" ;;
            esac
          done
      - name: Commitar resultados (result.json + raw/, sem work/)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/ ':(exclude,glob)runs/*/work/**'
          if git diff --cached --quiet; then echo "Nada novo para guardar."; exit 0; fi
          git commit -m "data: resultados do lote (modelo ${{ inputs.model }}, workflow run ${{ github.run_id }})"
          for i in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep 5
          done
          echo "Falha ao enviar os resultados"; exit 1

  analyze:
    needs: [matrix, persist]
    if: always() && needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # lê o repositório já com os resultados deste lote E dos anteriores
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run -s validate
      - run: pip install -r analysis/requirements.txt
      - run: python analysis/analyze.py --runs runs --out analysis/out
      - uses: actions/upload-artifact@v4
        with:
          name: analysis
          path: analysis/out/
